<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec">
<title>你是古希腊的哪位神 · 8 题速测 | 德尔斐神谕</title>
<style>
  :root{
    --marble:#f6f3ec;
    --card:#fffdf8;
    --sea:#1f5fa8;
    --sea-2:#7fb3d9;
    --gold:#c9a35c;
    --gold-2:#e2c98a;
    --terra:#c4623f;
    --olive:#6f7f4a;
    --ink:#22303f;
    --ink-2:#5c6570;
    --muted:#8d8979;
    --line:rgba(201,163,92,.38);
    --line-soft:rgba(201,163,92,.22);
    --shadow:0 26px 60px -34px rgba(61,71,82,.32), 0 6px 20px -14px rgba(61,71,82,.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; overflow-x:hidden}
  body{
    min-height:100vh;
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:16px; line-height:1.7;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
    background-color:var(--marble);
    background-image:
      radial-gradient(ellipse 72% 42% at 14% 0%, rgba(255,255,255,.9), rgba(255,255,255,0) 62%),
      radial-gradient(ellipse 54% 34% at 92% 16%, rgba(226,201,138,.15), rgba(226,201,138,0) 60%),
      radial-gradient(ellipse 62% 44% at 18% 88%, rgba(127,179,217,.10), rgba(127,179,217,0) 66%),
      repeating-linear-gradient(118deg, rgba(150,137,110,.052) 0 1px, rgba(150,137,110,0) 1px 30px),
      repeating-linear-gradient(58deg, rgba(150,137,110,.034) 0 1px, rgba(150,137,110,0) 1px 45px),
      linear-gradient(180deg,#fbf9f3 0%, #f6f3ec 55%, #f2eee5 100%);
    background-attachment:fixed;
  }
  [hidden]{display:none !important}
  button{font-family:inherit; font-size:inherit; color:inherit; border:none; background:none; cursor:pointer; touch-action:manipulation}
  p,h1,h2,h3,ol,ul{margin:0}
  a{color:inherit}
  .display{font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif}
  .app{
    position:relative; z-index:1;
    max-width:520px; width:100%;
    margin:0 auto;
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
  }
  .screen{display:flex; flex-direction:column; min-height:calc(100vh - 34px); min-height:calc(100svh - 34px); position:relative}
  .screen-in{animation:screenIn .34s cubic-bezier(.22,.8,.3,1) both}
  @keyframes screenIn{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:translateY(0)}}
  @keyframes floaty{0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)}}
  @keyframes coinPulse{0%,100%{opacity:.55; transform:scale(.98)} 50%{opacity:1; transform:scale(1.02)}}
  @keyframes ringSpin{to{transform:rotate(360deg)}}
  @keyframes shimmer{0%{background-position:120% 0} 100%{background-position:-120% 0}}

  /* ---------- 封面 ---------- */
  .cover-wrap{flex:1; display:flex; flex-direction:column; justify-content:center}
  .cover-card{
    position:relative;
    background:linear-gradient(180deg, rgba(255,253,248,.94) 0%, rgba(255,252,244,.98) 100%);
    border:1px solid var(--line);
    border-radius:28px;
    padding:26px 22px 22px;
    box-shadow:var(--shadow), inset 0 1px 0 #fff;
    overflow:hidden;
  }
  .cover-card::before{
    content:""; position:absolute; inset:8px; border-radius:22px;
    border:1px solid rgba(201,163,92,.15); pointer-events:none;
  }
  .kicker{
    display:flex; align-items:center; gap:9px;
    font-size:10px; font-weight:700; letter-spacing:.24em; color:var(--gold);
    text-transform:uppercase;
  }
  .kicker::before{content:""; width:22px; height:1px; background:linear-gradient(90deg,var(--gold),rgba(201,163,92,0))}
  .cover-title{
    margin:12px 0 6px;
    font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
    font-size:clamp(38px,11.6vw,52px);
    line-height:1.14; font-weight:700; letter-spacing:.01em;
  }
  .cover-title em{
    font-style:normal; color:var(--sea); position:relative; white-space:nowrap;
  }
  .cover-title em::after{
    content:""; position:absolute; left:1px; right:1px; bottom:2px; height:6px;
    background:linear-gradient(90deg, rgba(226,201,138,.55), rgba(226,201,138,0));
    border-radius:4px; z-index:-1;
  }
  .cover-sub{font-size:13.5px; color:var(--ink-2); line-height:1.85; margin-top:6px}
  .cover-art{width:100%; margin:2px auto 0; max-width:400px}
  .temple-svg{display:block; width:100%; height:auto; filter:drop-shadow(0 20px 24px rgba(88,78,52,.13))}
  .cover-coin{animation:floaty 5.4s ease-in-out infinite}
  .cover-desc{
    font-size:13px; color:var(--ink-2); line-height:1.9;
    border-left:2px solid rgba(201,163,92,.5); padding-left:12px; margin:4px 0 16px;
  }
  .facts{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .fact{
    font-size:11px; font-weight:600; letter-spacing:.06em; color:var(--ink-2);
    padding:6px 11px; border-radius:999px;
    background:linear-gradient(180deg,#fffefb,#f8f2e4);
    border:1px solid rgba(201,163,92,.28);
    box-shadow:0 4px 10px -8px rgba(61,71,82,.4), inset 0 1px 0 #fff;
  }
  .fact b{color:var(--sea); font-weight:700}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; min-height:56px; padding:12px 18px;
    border-radius:999px; font-size:15px; font-weight:700; letter-spacing:.1em;
    transition:transform .14s ease, box-shadow .14s ease, background .14s ease;
  }
  .btn:active{transform:translateY(2px) scale(.996)}
  .btn-primary{
    color:#fffdf8;
    background:linear-gradient(180deg,#2f75b7 0%, var(--sea) 58%, #174a86 100%);
    border:1px solid rgba(226,201,138,.7);
    box-shadow:0 16px 30px -18px rgba(31,95,168,.72), 0 6px 14px -10px rgba(31,95,168,.5), inset 0 1px 0 rgba(255,255,255,.32);
  }
  .btn-primary:active{box-shadow:0 8px 18px -14px rgba(31,95,168,.6), inset 0 1px 0 rgba(255,255,255,.25)}
  .btn-ghost{
    color:var(--sea);
    background:linear-gradient(180deg,#fffefb,#f8f3e8);
    border:1px solid rgba(201,163,92,.44);
    box-shadow:0 8px 18px -14px rgba(61,71,82,.3), inset 0 1px 0 #fff;
  }
  .cover-link{text-align:center; margin-top:13px; font-size:12px}
  .cover-link a{
    color:var(--sea); text-decoration:none; border-bottom:1px solid rgba(31,95,168,.28);
    padding-bottom:2px;
  }
  .cover-note{text-align:center; font-size:10.5px; color:var(--muted); margin-top:13px; letter-spacing:.04em}
  .gold-rule{height:1px; background:linear-gradient(90deg,rgba(201,163,92,0),rgba(201,163,92,.55),rgba(201,163,92,0)); margin:14px 0}

  /* ---------- 答题 ---------- */
  .qtop{
    position:sticky; top:0; z-index:5;
    padding:calc(2px + env(safe-area-inset-top)) 2px 12px;
    background:linear-gradient(180deg, rgba(246,243,236,.97) 0%, rgba(246,243,236,.86) 72%, rgba(246,243,236,0) 100%);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .qtop-row{display:flex; align-items:center; gap:12px}
  .iconbtn{
    flex:none; width:42px; height:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--sea); background:rgba(255,253,248,.9);
    border:1px solid rgba(201,163,92,.42);
    box-shadow:0 8px 16px -12px rgba(61,71,82,.4), inset 0 1px 0 #fff;
    transition:opacity .2s, transform .14s;
  }
  .iconbtn:active{transform:translateY(1px)}
  .iconbtn:disabled{opacity:.32; box-shadow:none}
  .iconbtn svg{width:19px; height:19px; display:block}
  .qmeta{flex:1; min-width:0}
  .qline{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:7px}
  .qcount{font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.04em}
  .qcount b{color:var(--sea); font-size:13px}
  .qstage{font-size:9px; letter-spacing:.2em; color:var(--gold); font-weight:700; white-space:nowrap}
  .track{height:3px; border-radius:99px; background:rgba(201,163,92,.2); overflow:hidden}
  .track i{
    display:block; height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg, var(--gold), var(--gold-2));
    box-shadow:0 0 8px rgba(226,201,138,.7);
    transition:width .36s cubic-bezier(.3,.1,.2,1);
  }
  .qbody{flex:1; padding:14px 0 6px; display:flex; flex-direction:column}
  .qcard{
    position:relative;
    background:linear-gradient(180deg, rgba(255,253,248,.97), rgba(255,252,245,.94));
    border:1px solid var(--line-soft);
    border-radius:26px;
    padding:22px 18px 20px;
    box-shadow:var(--shadow), inset 0 1px 0 #fff;
  }
  .qeyebrow{
    display:inline-flex; align-items:center; gap:7px;
    font-size:9.5px; font-weight:700; letter-spacing:.2em; color:var(--gold);
    margin-bottom:11px;
  }
  .qeyebrow::before{content:""; width:14px; height:1px; background:var(--gold)}
  .qtext{
    font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
    font-size:21px; line-height:1.55; font-weight:700; letter-spacing:.01em;
    color:var(--ink); margin-bottom:8px;
  }
  .hint{font-size:12px; color:var(--muted); line-height:1.75; margin-bottom:18px}
  .opts{display:flex; flex-direction:column; gap:10px}
  .opt{
    display:flex; align-items:flex-start; gap:12px; width:100%; min-width:0;
    text-align:left; padding:14px 15px;
    border-radius:18px;
    background:linear-gradient(180deg,#fffdf8 0%, #f8f4ea 100%);
    border:1px solid rgba(201,163,92,.30);
    box-shadow:0 10px 20px -17px rgba(61,71,82,.4), inset 0 1px 0 #fff;
    transition:border-color .18s, background .18s, box-shadow .18s, transform .12s;
  }
  .opt:active{transform:translateY(1px)}
  .opt.sel{
    border-color:var(--gold);
    background:linear-gradient(180deg,#fdf8e9 0%, #edf4fa 100%);
    box-shadow:0 0 0 2px rgba(226,201,138,.32), 0 14px 24px -18px rgba(31,95,168,.42), inset 0 1px 0 #fff;
  }
  .opt-letter{
    flex:none; width:27px; height:27px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:"Songti SC","STSong",serif; font-size:12px; color:var(--gold);
    border:1px solid rgba(201,163,92,.5); background:#fffdf8;
    transition:background .18s, color .18s, border-color .18s;
  }
  .opt.sel .opt-letter{background:var(--gold); color:#fffdf8; border-color:var(--gold)}
  .opt-text{flex:1; min-width:0; font-size:14.5px; line-height:1.65; color:var(--ink)}
  .qfoot{text-align:center; font-size:10.5px; color:var(--muted); letter-spacing:.05em; padding-top:16px; margin-top:auto}

  /* ---------- 求问加载 ---------- */
  .loading-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 8px}
  .loading-emblem{position:relative; width:136px; height:136px; display:flex; align-items:center; justify-content:center; margin-bottom:22px}
  .loading-emblem::before{
    content:""; position:absolute; inset:0; border-radius:50%;
    border:1px solid rgba(201,163,92,.22);
    border-top-color:var(--gold); border-right-color:rgba(226,201,138,.75);
    animation:ringSpin 1.5s linear infinite;
  }
  .load-coin{width:94px; height:94px; animation:coinPulse 1.3s ease-in-out infinite}
  .load-branch{position:absolute; width:34px; height:86px; opacity:.55; bottom:-4px}
  .load-branch.left{left:-8px; transform:scaleX(-1)}
  .load-branch.right{right:-8px}
  .loading-title{font-family:"Songti SC","STSong","Noto Serif SC",serif; font-size:22px; font-weight:700; letter-spacing:.02em}
  .loading-sub{font-size:12px; color:var(--muted); margin-top:9px; letter-spacing:.05em}
  .loading-bar{width:150px; height:3px; border-radius:99px; background:rgba(201,163,92,.18); margin-top:24px; overflow:hidden}
  .loading-bar i{
    display:block; width:45%; height:100%; border-radius:99px;
    background:linear-gradient(90deg, rgba(201,163,92,0), var(--gold-2), var(--gold));
    animation:shimmer 1.2s linear infinite;
  }

  /* ---------- 结果 ---------- */
  .report{display:flex; flex-direction:column; gap:13px; padding-top:2px}
  .report-card{
    position:relative;
    background:linear-gradient(180deg, rgba(255,253,248,.97), rgba(255,252,245,.94));
    border:1px solid var(--line-soft);
    border-radius:24px;
    padding:20px 18px;
    box-shadow:var(--shadow), inset 0 1px 0 #fff;
    overflow:hidden;
  }
  .hero-card{
    text-align:center; padding:24px 18px 22px;
    border-color:rgba(201,163,92,.42);
    background:
      radial-gradient(ellipse 80% 56% at 50% 0%, rgba(226,201,138,.16), rgba(226,201,138,0) 66%),
      linear-gradient(180deg, #fffdf8, #fdf9ee);
  }
  .hero-kicker{font-size:9px; font-weight:700; letter-spacing:.26em; color:var(--gold); text-transform:uppercase}
  .coin-stage{display:flex; align-items:center; justify-content:center; gap:1px; margin:5px 0 -2px}
  .coin-halo{position:relative; width:112px; height:112px; display:flex; align-items:center; justify-content:center}
  .coin-halo::before{
    content:""; position:absolute; inset:4px; border-radius:50%;
    background:radial-gradient(circle, rgba(226,201,138,.30), rgba(226,201,138,0) 68%);
    animation:coinPulse 2.8s ease-in-out infinite;
  }
  .coin-big{position:relative; width:100px; height:100px; z-index:1; filter:drop-shadow(0 10px 14px rgba(154,118,55,.24))}
  .branch{width:52px; height:92px; opacity:.62; flex:none}
  .coin-stage .branch:last-child{transform:scaleX(-1)}
  .type-no{font-family:"Songti SC","STSong",serif; font-size:11px; letter-spacing:.3em; color:var(--gold); font-weight:700; margin-top:2px}
  .type-cn{
    font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
    font-size:clamp(42px,12vw,54px); line-height:1.15; font-weight:700; letter-spacing:.06em;
    color:var(--ink); margin:2px 0 1px;
  }
  .type-en{font-size:10px; font-weight:700; letter-spacing:.42em; color:var(--sea-2); text-indent:.42em}
  .type-title{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px;
    margin-top:10px; font-size:14.5px; font-weight:700; color:var(--sea);
  }
  .title-dot{width:4px; height:4px; border-radius:50%; background:var(--gold); flex:none}
  .type-tagline{font-weight:400; color:var(--ink-2); font-size:13px; letter-spacing:.04em}
  .relic-chip{
    display:inline-flex; align-items:center; gap:8px;
    margin-top:14px; padding:7px 15px; border-radius:999px;
    font-size:12px; font-weight:600; color:var(--ink-2);
    background:#fffdf8; border:1px solid rgba(201,163,92,.4);
    box-shadow:0 6px 14px -12px rgba(61,71,82,.4), inset 0 1px 0 #fff;
  }
  .relic-label{font-size:9px; letter-spacing:.18em; color:var(--gold); font-weight:700}
  .sec-label{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    padding-bottom:9px; margin-bottom:12px;
    border-bottom:1px solid rgba(201,163,92,.20);
    font-size:12px; font-weight:700; letter-spacing:.16em; color:var(--sea);
  }
  .sec-label span{font-size:8.5px; letter-spacing:.22em; color:var(--gold); font-weight:600}
  .temple-text{
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:16px; line-height:1.95; color:var(--ink); letter-spacing:.02em;
  }
  .idx-row{margin-bottom:13px}
  .idx-row:last-of-type{margin-bottom:6px}
  .idx-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px}
  .idx-name{font-size:12.5px; font-weight:600; color:var(--ink-2); letter-spacing:.06em}
  .idx-en{font-size:9px; letter-spacing:.12em; color:var(--muted); font-weight:400}
  .idx-val{font-family:"Songti SC","STSong",serif; font-size:16px; font-weight:700; color:var(--sea)}
  .idx-track{height:7px; border-radius:99px; background:#f0ebdd; overflow:hidden}
  .idx-track i{display:block; height:100%; border-radius:99px}
  .idx-control i{background:linear-gradient(90deg,#9cc5e3,var(--sea))}
  .idx-empathy i{background:linear-gradient(90deg,#dca68e,var(--terra))}
  .idx-chaos i{background:linear-gradient(90deg,#aeb884,var(--olive))}
  .index-note{font-size:10.5px; color:var(--muted); margin-top:12px; letter-spacing:.04em}
  .oracle-card{background:linear-gradient(180deg,#fffdf8,#fdf8eb)}
  .oracle-text{
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:15.5px; line-height:2.05; color:var(--ink); letter-spacing:.02em;
    text-align:justify;
  }
  .oracle-text::first-letter{font-size:1.35em; color:var(--sea)}
  .oracle-sign{
    margin-top:14px; padding-top:11px; border-top:1px dashed rgba(201,163,92,.32);
    text-align:right; font-size:9.5px; letter-spacing:.2em; color:var(--gold);
  }
  .nemesis-card{background:linear-gradient(180deg,#fffdf8,#fbf1ec)}
  .nemesis-label{color:var(--terra)}
  .nem-row{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .nem-name{font-family:"Songti SC","STSong",serif; font-size:20px; font-weight:700; color:var(--terra)}
  .nem-name span{font-family:"PingFang SC","Microsoft YaHei",sans-serif; font-size:11px; color:var(--ink-2); font-weight:400; margin-left:7px}
  .nem-en{font-size:9px; letter-spacing:.26em; color:var(--muted); margin-top:3px}
  .nem-vs{
    flex:none; width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:"Songti SC","STSong",serif; font-size:10px; font-weight:700; color:#fffdf8;
    background:linear-gradient(180deg,#d07c58,var(--terra));
    box-shadow:0 6px 14px -10px rgba(196,98,63,.7), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .nem-why{margin-top:12px; font-size:13.5px; line-height:1.8; color:var(--ink-2)}
  .bless-card{
    position:relative; text-align:center; padding:26px 20px 24px;
    background:
      radial-gradient(ellipse 70% 60% at 50% 0%, rgba(226,201,138,.18), rgba(226,201,138,0) 70%),
      linear-gradient(180deg,#fffdf8,#fbf4e4);
    border:1px solid rgba(201,163,92,.44);
    border-radius:24px;
    box-shadow:var(--shadow), inset 0 1px 0 #fff;
  }
  .bless-seal{
    width:46px; height:46px; margin:0 auto 9px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:"Songti SC","STSong",serif; font-size:19px; color:var(--gold);
    border:1px solid var(--gold);
    box-shadow:0 0 0 4px #fffdf8, 0 0 0 5px rgba(201,163,92,.30), 0 8px 16px -12px rgba(154,118,55,.5);
  }
  .bless-label{font-size:9px; letter-spacing:.26em; color:var(--gold); font-weight:700; text-transform:uppercase}
  .bless-text{
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:19px; line-height:1.85; color:var(--ink); font-weight:700; letter-spacing:.03em;
    margin-top:8px;
  }
  .guide-list{list-style:none; padding:0; margin:0}
  .guide-list li{display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-top:1px dashed rgba(201,163,92,.26)}
  .guide-list li:first-child{border-top:none; padding-top:2px}
  .guide-no{flex:none; font-family:"Songti SC","STSong",serif; font-size:11px; letter-spacing:.1em; color:var(--gold); padding-top:2px}
  .guide-list p{font-size:13.5px; line-height:1.8; color:var(--ink-2)}
  .aff-row{
    display:grid; grid-template-columns:26px 1fr 40px; gap:10px; align-items:center;
    padding:8px 8px; margin:0 -8px; border-radius:12px;
  }
  .aff-row.now{background:linear-gradient(90deg, rgba(226,201,138,.20), rgba(226,201,138,.05))}
  .aff-rank{font-family:"Songti SC","STSong",serif; font-size:10px; color:var(--gold); text-align:center}
  .aff-main{min-width:0}
  .aff-name{display:flex; align-items:baseline; gap:7px; margin-bottom:5px; min-width:0}
  .aff-name b{font-size:13px; color:var(--ink); white-space:nowrap}
  .aff-name span{font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .aff-track{height:5px; border-radius:99px; background:#f0ebdd; overflow:hidden}
  .aff-track i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--sea-2),var(--sea))}
  .aff-row.now .aff-track i{background:linear-gradient(90deg,var(--gold-2),var(--gold))}

  var answers = [];

  function calc(input){
    var ans = input || answers;
    var scores = {};
    var i, j, q, oi, opt, key;
    for (i = 0; i < ORDER.length; i++) scores[ORDER[i]] = 0;
    for (q = 0; q < QUESTIONS.length; q++){
      oi = ans[q];
      if (oi === undefined || oi === null) continue;
      opt = QUESTIONS[q].opts[oi];
      if (!opt) continue;
      scores[opt.t] += (opt.v || 3);
    }
    var winner = ORDER[0], best = -1;
    for (j = 0; j < ORDER.length; j++){
      key = ORDER[j];
      if (scores[key] > best){ best = scores[key]; winner = key; }
    }
    return {winner:winner, scores:scores, top:best};
  }

  root.__quizTest = {ORDER:ORDER, TYPES:TYPES, QUESTIONS:QUESTIONS, answers:answers, calc:calc};
})(typeof window !== 'undefined' ? window : globalThis);

<!-- 交互与结果渲染 -->
<script>
(function(){
  'use strict';

  var API = window.__quizTest;
  var QUESTIONS = API.QUESTIONS;
  var TYPES = API.TYPES;
  var ORDER = API.ORDER;
  var answers = API.answers;
  var total = QUESTIONS.length;
  var cur = 0;
  var locked = false;
  var oracleTimer = null;
  var shareText = '';

  function $(id){ return document.getElementById(id); }
  var screens = {
    cover: $('screen-cover'),
    quiz: $('screen-quiz'),
    loading: $('screen-loading'),
    result: $('screen-result')
  };
  var optsBox = $('opts');
  var backBtn = $('backBtn');
  var progressFill = $('progressFill');
  var toastEl = $('toast');
  var toastTimer = null;

  function showScreen(name){
    for (var k in screens){
      if (screens[k]) screens[k].hidden = (k !== name);
    }
    var s = screens[name];
    if (!s) return;
    s.classList.remove('screen-in');
    void s.offsetWidth;
    s.classList.add('screen-in');
    window.scrollTo(0, 0);
  }

  function toast(msg){
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 2000);
  }

  function progressPct(){
    var done = cur;
    var has = answers[cur] !== undefined && answers[cur] !== null;
    if (has) done = cur + 1;
    return Math.round(done / total * 100);
  }

  function updateProgress(){
    progressFill.style.width = progressPct() + '%';
  }

  function renderQuestion(){
    var q = QUESTIONS[cur];
    if (!q) return;
    $('qNow').textContent = String(cur + 1);
    $('qTotal').textContent = String(total);
    $('qEyebrow').textContent = q.tag;
    $('qText').textContent = q.text;
    $('qHint').textContent = q.hint;
    backBtn.disabled = (cur === 0);
    optsBox.innerHTML = '';
    for (var i = 0; i < q.opts.length; i++){
      (function(index){
        var o = q.opts[index];
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'opt';
        b.setAttribute('data-i', String(index));
        var letter = document.createElement('span');
        letter.className = 'opt-letter';
        letter.textContent = 'ABCD'.charAt(index);
        var txt = document.createElement('span');
        txt.className = 'opt-text';
        txt.textContent = o.text;
        b.appendChild(letter);
        b.appendChild(txt);
        if (answers[cur] === index) b.classList.add('sel');
        b.addEventListener('click', function(){ choose(index); });
        optsBox.appendChild(b);
      })(i);
    }
    updateProgress();
  }

  function choose(index){
    if (locked) return;
    locked = true;
    answers[cur] = index;
    var kids = optsBox.children;
    for (var i = 0; i < kids.length; i++){
      if (i === index) kids[i].classList.add('sel');
      else kids[i].classList.remove('sel');
    }
    updateProgress();
    setTimeout(function(){
      locked = false;
      if (cur < total - 1){
        cur++;
        renderQuestion();
      } else {
        askOracle();
      }
    }, 300);
  }

  function askOracle(){
    showScreen('loading');
    if (oracleTimer) clearTimeout(oracleTimer);
    oracleTimer = setTimeout(function(){
      oracleTimer = null;
      var res = API.calc(answers);
      renderResult(res);
      showScreen('result');
    }, 700);
  }

  function restart(){
    if (oracleTimer){ clearTimeout(oracleTimer); oracleTimer = null; }
    answers.length = 0;
    cur = 0;
    locked = false;
    renderQuestion();
    showScreen('quiz');
  }

  function backToLast(){
    if (oracleTimer){ clearTimeout(oracleTimer); oracleTimer = null; }
    locked = false;
    cur = total - 1;
    renderQuestion();
    showScreen('quiz');
  }

  function indexRow(name, en, val, cls){
    return '<div class="idx-row ' + cls + '">' +
      '<div class="idx-head"><span class="idx-name">' + name + '<span class="idx-en"> / ' + en + '</span></span><span class="idx-val">' + val + '%</span></div>' +
      '<div class="idx-track"><i style="width:' + val + '%"></i></div>' +
    '</div>';
  }

  function buildShare(type){
    var link = (typeof location !== 'undefined' ? location.href : '').split('#')[0];
    return '【德尔斐神谕】我是 NO.' + type.no + ' ' + type.cn + ' ' + type.en + ' · ' + type.title + '，' + type.tagline +
      '。神性指数：掌控力 ' + type.idx.control + ' / 共情力 ' + type.idx.empathy + ' / 混乱度 ' + type.idx.chaos +
      '。宿敌：' + TYPES[type.nemesis].cn + '。' + type.bless + ' 你是古希腊的哪位神？ ' + link;
  }

  function renderResult(res){
    var winner = res.winner;
    var type = TYPES[winner];
    var nem = TYPES[type.nemesis];

    var appear = {};
    var maxScore = {};
    var i, k;
    for (i = 0; i < ORDER.length; i++){ appear[ORDER[i]] = 0; maxScore[ORDER[i]] = 1; }
    for (i = 0; i < QUESTIONS.length; i++){
      for (var j = 0; j < QUESTIONS[i].opts.length; j++){
        appear[QUESTIONS[i].opts[j].t]++;
      }
    }
    for (i = 0; i < ORDER.length; i++){
      k = ORDER[i];
      maxScore[k] = Math.max(1, appear[k] * 3);
    }

    var sorted = ORDER.slice().sort(function(a, b){
      var d = res.scores[b] - res.scores[a];
      if (d) return d;
      return ORDER.indexOf(a) - ORDER.indexOf(b);
    });

    var affHtml = '';
    for (i = 0; i < sorted.length; i++){
      k = sorted[i];
      var t = TYPES[k];
      var pct = Math.max(0, Math.min(100, Math.round(res.scores[k] / maxScore[k] * 100)));
      affHtml += '<div class="aff-row' + (k === winner ? ' now' : '') + '">' +
        '<span class="aff-rank">' + ('0' + (i + 1)).slice(-2) + '</span>' +
        '<div class="aff-main"><div class="aff-name"><b>' + t.cn + '</b><span>' + t.title + '</span></div>' +
        '<div class="aff-track"><i style="width:' + pct + '%"></i></div></div>' +
        '<span class="aff-pct">' + pct + '%</span>' +
      '</div>';
    }

    var guideHtml = '';
    for (i = 0; i < type.guide.length; i++){
      guideHtml += '<li><span class="guide-no">' + ('0' + (i + 1)).slice(-2) + '</span><p>' + type.guide[i] + '</p></li>';
    }

    shareText = buildShare(type);

    var html =
      '<div class="report-card hero-card">' +
        '<div class="hero-kicker">Delphic Oracle · 专属神谕报告</div>' +
        '<div class="coin-stage">' +
          '<svg class="branch" viewBox="0 0 100 160" aria-hidden="true"><use href="#laurelBranch"/></svg>' +
          '<div class="coin-halo"><svg class="coin-big" viewBox="0 0 120 120" aria-hidden="true"><use href="#oracleCoin"/></svg></div>' +
          '<svg class="branch" viewBox="0 0 100 160" aria-hidden="true"><use href="#laurelBranch"/></svg>' +
        '</div>' +
        '<div class="type-no">NO.' + type.no + '</div>' +
        '<h1 class="type-cn display">' + type.cn + '</h1>' +
        '<div class="type-en">' + type.en + '</div>' +
        '<div class="type-title">' + type.title + '<span class="title-dot"></span><span class="type-tagline">' + type.tagline + '</span></div>' +
        '<div class="relic-chip"><span class="relic-label">圣物</span>' + type.relic + '</div>' +
      '</div>' +

      '<div class="report-card">' +
        '<div class="sec-label">你的神殿<span>YOUR TEMPLE</span></div>' +
        '<p class="temple-text">' + type.temple + '</p>' +
      '</div>' +

      '<div class="report-card">' +
        '<div class="sec-label">神性指数<span>DIVINE INDEX</span></div>' +
        indexRow('掌控力', 'CONTROL', type.idx.control, 'idx-control') +
        indexRow('共情力', 'EMPATHY', type.idx.empathy, 'idx-empathy') +
        indexRow('混乱度', 'CHAOS', type.idx.chaos, 'idx-chaos') +
        '<p class="index-note">三项之和不必等于 100，神本来就不讲道理。</p>' +
      '</div>' +

      '<div class="report-card oracle-card">' +
        '<div class="sec-label">神谕正文<span>THE ORACLE</span></div>' +
        '<p class="oracle-text">' + type.oracle + '</p>' +
        '<div class="oracle-sign">德尔斐 · 神谕之印</div>' +
      '</div>' +

      '<div class="report-card nemesis-card">' +
        '<div class="sec-label nemesis-label">宿敌之神<span>NEMESIS</span></div>' +
        '<div class="nem-row">' +
          '<div><div class="nem-name">' + nem.cn + '<span>' + nem.title + ' · ' + nem.tagline + '</span></div><div class="nem-en">' + nem.en + '</div></div>' +
          '<div class="nem-vs">VS</div>' +
        '</div>' +
        '<p class="nem-why">' + type.nemesisWhy + '</p>' +
      '</div>' +

      '<div class="bless-card">' +
        '<div class="bless-seal">福</div>' +
        '<div class="bless-label">Oracle Blessing</div>' +
        '<p class="bless-text">' + type.bless + '</p>' +
      '</div>' +

      '<div class="report-card">' +
        '<div class="sec-label">三条神谕指引<span>ORACLE ADVICE</span></div>' +
        '<ol class="guide-list">' + guideHtml + '</ol>' +
      '</div>' +

      '<div class="report-card">' +
        '<div class="sec-label">八神亲和排行<span>AFFINITY</span></div>' +
        affHtml +
      '</div>' +

      '<div class="report-card">' +
        '<div class="sec-label">分享这篇神谕<span>SHARE</span></div>' +
        '<p class="share-preview" id="sharePreview"></p>' +
        '<button class="btn btn-primary" type="button" data-act="copy" id="copyBtn">复制分享文案</button>' +
      '</div>' +

      '<p class="disclaimer">娱乐向 · 神谕不构成预言或心理诊断</p>' +

      '<div class="result-actions">' +
        '<button class="btn btn-primary" type="button" data-act="restart">重新测</button>' +
        '<button class="btn btn-ghost" type="button" data-act="last">回到最后一题修改</button>' +
      '</div>' +

      '<div class="cross-link"><a href="greek-god-quiz.html">想看完整版？挑战 18 题 →</a></div>';

    $('resultRoot').innerHTML = html;
    $('sharePreview').textContent = shareText;
  }

  function legacyCopy(text){
    try{
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      var ok = false;
      try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
      document.body.removeChild(ta);
      return ok;
    }catch(e){
      return false;
    }
  }

  function copyShare(btn){
    if (!btn || btn.getAttribute('data-busy') === '1') return;
    btn.setAttribute('data-busy', '1');
    btn.textContent = '分享文案已生成';

    var settled = false;
    var resetTimer = null;

    function reset(){
      btn.setAttribute('data-busy', '0');
      btn.textContent = '复制分享文案';
      if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; }
    }
    function done(ok){
      if (settled) return;
      settled = true;
      if (ok){
        btn.textContent = '已复制';
        btn.setAttribute('data-busy', '0');
        toast('神谕已复制，去分享吧');
        resetTimer = setTimeout(reset, 2200);
      } else {
        window.prompt('长按复制分享文案', shareText);
        reset();
      }
    }

    try{
      if (navigator.clipboard && navigator.clipboard.writeText){
        var p = navigator.clipboard.writeText(shareText);
        if (p && typeof p.then === 'function'){
          p.then(function(){ done(true); }).catch(function(){ done(legacyCopy(shareText)); });
        } else {
          done(legacyCopy(shareText));
        }
        setTimeout(function(){ done(legacyCopy(shareText)); }, 1500);
      } else {
        done(legacyCopy(shareText));
      }
    }catch(e){
      done(legacyCopy(shareText));
    }
  }

  $('startBtn').addEventListener('click', function(){
    answers.length = 0;
    cur = 0;
    locked = false;
    renderQuestion();
    showScreen('quiz');
  });

  backBtn.addEventListener('click', function(){
    if (locked) return;
    if (cur > 0){ cur--; renderQuestion(); }
  });

  $('resultRoot').addEventListener('click', function(e){
    var node = e.target;
    while (node && node !== this && !(node.getAttribute && node.getAttribute('data-act'))){
      node = node.parentNode;
    }
    if (!node || !node.getAttribute) return;
    var act = node.getAttribute('data-act');
    if (act === 'restart') restart();
    else if (act === 'last') backToLast();
    else if (act === 'copy') copyShare(node);
  });

  renderQuestion();
})();
</script>
</body>
</html>
